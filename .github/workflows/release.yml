name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the build to (e.g. v1.4.0)"
        required: true

permissions:
  contents: write

jobs:
  upload-asset:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      # HACS downloads this asset instead of the repo file, which makes
      # installs show up in the HACS download counter
      - name: Upload card to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/weasley-clock-card.js --clobber
